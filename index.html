<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IELTS Tracker — 4.5 → 7.0+ Yol Xəritəsi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="layout">

  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h7l-1 8 10-12h-7l1-8z"/></svg>
      </div>
      <div class="brand-text">
        <div class="brand-name">IELTS<span>Tracker</span></div>
        <div class="brand-sub">4.5 &rarr; 7.0+</div>
      </div>
    </div>

    <nav class="nav" id="nav">
      <button class="nav-item" data-tab="dashboard">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
        <span>İdarə Paneli</span>
      </button>
      <button class="nav-item" data-tab="daily">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/><path d="m9 16 2 2 4-4"/></svg>
        <span>Gündəlik Plan</span>
      </button>
      <button class="nav-item" data-tab="journal">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/><path d="M12 14c-.9-1.2-2.4-1-2.4.3 0 1.3 2.4 2.7 2.4 2.7s2.4-1.4 2.4-2.7c0-1.3-1.5-1.5-2.4-.3z"/></svg>
        <span>Gündəlik Jurnal</span>
      </button>
      <button class="nav-item" data-tab="errors">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>
        <span>Səhv Analizi</span>
      </button>
      <button class="nav-item" data-tab="roadmap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"/><path d="M9 4v14M15 6v14"/></svg>
        <span>Yol Xəritəsi</span>
      </button>
      <button class="nav-item" data-tab="mocks">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m23 6-9.5 9.5-5-5L1 18"/><path d="M17 6h6v6"/></svg>
        <span>Proqres &amp; Mocks</span>
      </button>
      <button class="nav-item" data-tab="vocab">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
        <span>Vokabulyar</span>
      </button>
      <button class="nav-item" data-tab="speaking">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10v1a7 7 0 0 0 14 0v-1"/><path d="M12 18v4"/></svg>
        <span>Speaking</span>
      </button>
    </nav>

    <div class="side-foot">
      <div class="sf-grid">
        <div><span>Həftə</span><b id="sfWeek">1 / 8</b></div>
        <div><span>Streak</span><b id="sfStreak">0 gün</b></div>
      </div>
      <div class="progress slim"><div class="progress-fill" id="sfProg"></div></div>
      <div class="sf-save" id="sfSave" title="Məlumatın harada saxlandığı">💾 yoxlanılır…</div>
    </div>
  </aside>

  <div class="overlay" id="overlay"></div>

  <main class="content">
    <header class="topbar">
      <button class="menu-btn" id="menuBtn" aria-label="Menyu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <h2 class="tb-title" id="tbTitle">İdarə Paneli</h2>
      <div class="tb-right">
        <span class="tb-date" id="tbDate"></span>
        <span class="chip chip-accent" id="tbStreakChip">0 gün</span>
      </div>
    </header>
    <div class="panels" id="panels"></div>
  </main>
</div>

<div class="toast" id="toast"></div>
<input type="file" id="importFile" accept=".json,application/json" hidden>
<script src="app.js"></script>
</body>
</html>
